<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Schedule - Google Play</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    :root {
      --md-sys-color-primary: #1A73E8;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #D2E3FC;
      --md-sys-color-on-primary-container: #0D1C33;
      --md-sys-color-surface: #FFFFFF;
      --md-sys-color-on-surface: #202124;
      --md-sys-color-surface-variant: #F1F3F4;
      --md-sys-color-on-surface-variant: #5F6368;
      --md-sys-color-outline: #DADCE0;
      --md-sys-color-success: #1E8E3E;
      --md-sys-color-warning: #F9AB00;

      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Nav */
    .top-nav {
      height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--md-sys-color-outline);
      background-color: var(--md-sys-color-surface);
      flex-shrink: 0;
    }

    .nav-left { display: flex; align-items: center; gap: 16px; }
    .nav-left img { width: 32px; height: 32px; }
    .nav-left h2 { font-family: 'Google Sans'; font-size: 20px; font-weight: 400; }

    .btn-icon-text {
      display: flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 100px;
      background: none; border: 1px solid var(--md-sys-color-outline); cursor: pointer;
      font-family: 'Google Sans'; font-size: 14px; font-weight: 500; color: var(--md-sys-color-on-surface);
      transition: var(--transition); text-decoration: none;
    }
    .btn-icon-text:hover { background-color: var(--md-sys-color-surface-variant); }

    /* Main Content */
    main {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }

    .header-section { margin-bottom: 32px; }
    .header-section h1 { font-family: 'Google Sans'; font-size: 32px; font-weight: 400; margin-bottom: 8px; }
    .header-section p { color: var(--md-sys-color-on-surface-variant); }

    /* Day Tabs */
    .day-tabs {
      display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--md-sys-color-outline); padding-bottom: 12px;
    }
    .day-tab {
      padding: 8px 20px; border-radius: 20px; cursor: pointer; font-family: 'Google Sans'; font-size: 14px; font-weight: 500;
      color: var(--md-sys-color-on-surface-variant); transition: var(--transition);
    }
    .day-tab:hover { background-color: var(--md-sys-color-surface-variant); }
    .day-tab.active { background-color: var(--md-sys-color-primary-container); color: var(--md-sys-color-primary); }

    /* Table/List Styling */
    .schedule-card {
      background: var(--md-sys-color-surface);
      border: 1px solid var(--md-sys-color-outline);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 32px;
    }

    .section-label {
      padding: 16px 24px; background: var(--md-sys-color-surface-variant); font-family: 'Google Sans';
      font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; color: var(--md-sys-color-on-surface-variant);
    }

    .person-row {
      display: flex; align-items: center; padding: 16px 24px; border-bottom: 1px solid var(--md-sys-color-outline-variant);
      transition: var(--transition);
    }
    .person-row:last-child { border-bottom: none; }
    .person-row:hover { background-color: rgba(0,0,0,0.01); }

    .avatar {
      width: 44px; height: 44px; border-radius: 50%; background-color: var(--md-sys-color-primary-container);
      display: flex; align-items: center; justify-content: center; font-family: 'Google Sans'; font-weight: 500;
      color: var(--md-sys-color-primary); flex-shrink: 0; margin-right: 16px;
    }

    .info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .ldap { font-family: 'Google Sans'; font-size: 15px; font-weight: 500; }
    .email { font-size: 12px; color: var(--md-sys-color-on-surface-variant); }

    .status-badge {
      padding: 6px 16px; border-radius: 100px; font-family: 'Google Sans'; font-size: 13px; font-weight: 500;
      display: flex; align-items: center; gap: 8px;
    }
    .status-on { background-color: #E6F4EA; color: #1E8E3E; }
    .status-off { background-color: var(--md-sys-color-surface-variant); color: var(--md-sys-color-on-surface-variant); }
    .status-vl { background-color: #FEF7E0; color: #B06000; }

    .pulse { width: 8px; height: 8px; border-radius: 50%; background-color: currentColor; animation: pulse-anim 2s infinite; }
    @keyframes pulse-anim {
      0% { box-shadow: 0 0 0 0 rgba(30,142,62, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(30,142,62, 0); }
      100% { box-shadow: 0 0 0 0 rgba(30,142,62, 0); }
    }

    .role-tag {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
      padding: 2px 8px; border-radius: 4px; margin-left: 8px;
    }
    .role-sup { background-color: #F3E5F5; color: #7B1FA2; }
    .role-sme { background-color: #E3F2FD; color: #1976D2; }

    .loading-container { display: flex; flex-direction: column; align-items: center; padding: 64px; gap: 16px; color: var(--md-sys-color-on-surface-variant); }
    .spinner { width: 40px; height: 40px; border: 4px solid var(--md-sys-color-outline-variant); border-top-color: var(--md-sys-color-primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header class="top-nav">
    <div class="nav-left">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Google_Play_2022_icon.svg/960px-Google_Play_2022_icon.svg.png" alt="Play">
      <h2>Escalations</h2>
    </div>
    <a href="#" class="btn-icon-text" id="back-btn">
      <span class="material-symbols-outlined">arrow_back</span>
      Dashboard
    </a>
  </header>

  <main>
    <div class="header-section">
      <h1>Team Availability</h1>
      <p id="today-display">Loading current schedule...</p>
    </div>

    <div class="day-tabs" id="day-tabs">
      <!-- Populated by JS -->
    </div>

    <div id="schedule-container">
      <div class="loading-container">
        <div class="spinner"></div>
        <p>Fetching schedule data...</p>
      </div>
    </div>
  </main>

  <script>
    let rawSchedule = [];
    let activeDayIdx = 0;

    window.onload = () => {
      google.script.run.withSuccessHandler(url => {
        document.getElementById('back-btn').href = url + '?page=dashboard';
      }).getWebAppUrl();

      google.script.run.withSuccessHandler(data => {
        rawSchedule = data;
        if (!data || data.length === 0) {
          document.getElementById('schedule-container').innerHTML = '<p style="text-align:center; padding:48px; color:grey;">No schedule data available.</p>';
          return;
        }
        renderTabs();
        renderSchedule(0);
      }).getSchedule();

      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('today-display').innerText = new Date().toLocaleDateString('en-US', options) + ' • PHT';
    };

    function renderTabs() {
      if (!rawSchedule.length) return;
      const days = rawSchedule[0].days;
      const container = document.getElementById('day-tabs');
      container.innerHTML = days.map((day, idx) => `
        <div class="day-tab ${idx === 0 ? 'active' : ''}" onclick="selectDay(${idx})">
          ${day.label}
        </div>
      `).join('');
    }

    function selectDay(idx) {
      activeDayIdx = idx;
      document.querySelectorAll('.day-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
      renderSchedule(idx);
    }

    function renderSchedule(dayIdx) {
      const container = document.getElementById('schedule-container');
      const supervisors = rawSchedule.filter(p => p.role.toLowerCase().includes('supervisor'));
      const smes = rawSchedule.filter(p => !p.role.toLowerCase().includes('supervisor'));

      let html = '';
      if (supervisors.length) {
        html += `<div class="schedule-card"><div class="section-label">Supervisors</div>${supervisors.map(p => renderPerson(p, dayIdx)).join('')}</div>`;
      }
      if (smes.length) {
        html += `<div class="schedule-card"><div class="section-label">Subject Matter Experts</div>${smes.map(p => renderPerson(p, dayIdx)).join('')}</div>`;
      }
      container.innerHTML = html || '<p>No data found.</p>';
    }

    function renderPerson(p, dayIdx) {
      const day = p.days[dayIdx] || { status: 'unknown', value: '—' };
      let statusClass = 'status-off';
      let statusLabel = day.value || 'Day Off';
      let hasPulse = false;

      if (day.status === 'on') {
        statusClass = 'status-on';
        hasPulse = true;
      } else if (day.status === 'vl') {
        statusClass = 'status-vl';
        statusLabel = 'On Leave';
      } else if (day.status === 'off') {
        statusLabel = 'Day Off';
      }

      const roleClass = p.role.toLowerCase().includes('supervisor') ? 'role-sup' : 'role-sme';
      const roleLabel = p.role.toLowerCase().includes('supervisor') ? 'SUP' : 'SME';

      return `
        <div class="person-row">
          <div class="avatar">${p.ldap[0].toUpperCase()}</div>
          <div class="info">
            <div class="ldap">${p.ldap} <span class="role-tag ${roleClass}">${roleLabel}</span></div>
            <div class="email">${p.email}</div>
          </div>
          <div class="status-badge ${statusClass}">
            ${hasPulse ? '<div class="pulse"></div>' : ''}
            ${statusLabel}
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
